services:
  db:
    image: postgres:16-alpine
    container_name: deliveryweb-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: delivery
      POSTGRES_PASSWORD: delivery
      POSTGRES_DB: deliveryapp
    ports:
      - "5432:5432"
    volumes:
      - deliveryweb-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivery -d deliveryapp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  deliveryweb-pgdata:
